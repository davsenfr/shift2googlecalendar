services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: shift-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.data:/app/.data
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: shift-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - backend